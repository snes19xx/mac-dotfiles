###
#  KITTY CONFIGURATION FILE 1 of 4
#  https://github.com/snes19xx
####

confirm_os_window_close 0

include ~/.local/state/theme/kitty_theme.conf

detect_urls yes
url_color #2d65b8
url_style curly

scrollback_lines 1500
wheel_scroll_multiplier 10.0

background_opacity 0.95
hide_window_decorations no

input_delay 0

enable_audio_bell no

# Mac mini: open at the size the Hyprland float rule used
initial_window_width 950
initial_window_height 550
remember_window_size no

# The Windows key arrives as Option (Karabiner swap); treat it as Alt
macos_option_as_alt yes

# The physical Alt key arrives as Cmd after the Karabiner swap. Send zellij's
# Alt shortcuts through so physical Alt+key works as it did on Linux.
map cmd+h send_key alt+h
map cmd+j send_key alt+j
map cmd+k send_key alt+k
map cmd+l send_key alt+l
map cmd+left send_key alt+left
map cmd+right send_key alt+right
map cmd+up send_key alt+up
map cmd+down send_key alt+down
map cmd+n send_key alt+n
map cmd+f send_key alt+f
map cmd+i send_key alt+i
map cmd+o send_key alt+o
map cmd+p send_key alt+p
map cmd+shift+p send_key alt+shift+p
map cmd+minus send_key alt+minus
map cmd+equal send_key alt+equal
map cmd+plus send_key alt+plus
map cmd+[ send_key alt+[
map cmd+] send_key alt+]
